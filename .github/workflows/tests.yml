name: API Tests
run-name: Test ${{ github.event.inputs.STAGE }} | ${{ github.event.inputs.SUITE }} marker | ${{ github.event.inputs.THREADS }} threads
on:
  workflow_dispatch:
    inputs:
      STAGE:
        description: "Choose stage"
        required: true
        type: environment
        default: "local_docker"
      SUITE:
        description: "Select pytest marker / Все тесты для сервиса и т. д."
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
      THREADS:
        description: "Select threads count"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
env: # указываются переменные запуска. !!! Переменные docker-compose должны совпадать с тем, что пропишется тут
  STAGE: ${{ inputs.STAGE }}  # внутри контейнера переменная окружения будет приниматься извне
  SUITE: ${{ inputs.SUITE }}
  THREADS: ${{ inputs.THREADS }}
  CI_COMMIT_REF_NAME: ${{ github.ref_name }}
  CI_COMMIT_SHORT_SHA: ${{ github.sha }}
permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest # на базе чего будет работать гитхаб раннер
    environment: ${{ inputs.STAGE }} # в environment подставится значение окружения из ENV, что задается выше. Эта переменная отвечает за Environment в гитхаб проекте: т. е. последующая джоба, и все переменные окружения будут тянуться из этого ENV
    steps:
      - uses: actions/checkout@v4 # uses - использование специальных гитхабовских джоб, которые позволяют совершать действия, в данном случае - клонирование репы, т. е. когда раннер поднимет окружение, он внутрь себя склонит нашу репу
      - uses: actions/checkout@v4
        with: # делается клон репозитория, но указание with ref дает выбрать, какую именно
          ref: gh-pages # в данном случае ветку с пейджами
          path: ./.github/gh-pages # куда клонируем эту ветку внутри раннера
      - name: Start AUT
        run: |
          git clone https://github.com/manikosto/qa-automation-sandbox.git qa-sandbox
          cd qa-sandbox
          docker compose up -d --build

      - name: Wait for AUT
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 \
              http://localhost:8000/docs -o /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
      
            echo "Waiting for backend ($i/60)..."
            sleep 2
          done
      
          echo "=== Container status ==="
          cd qa-sandbox
          docker compose ps -a
      
          echo "=== Backend logs ==="
          docker compose logs --no-color --tail=150 backend
      
          echo "=== Database logs ==="
          docker compose logs --no-color --tail=100 db
      
          exit 1

      - name: Create .env
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          DB_HOST: ${{ vars.DB_HOST }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries[]
            | select(.key | test("^(ADMIN|MODERATOR|USER|DB|ROLES)"))
            | "\(.key)=\(.value)"' > .env
          echo "DB_HOST=$DB_HOST" >> .env
      - name: Prepare Allure environment         # Подготовка allure-results - environment.properties
        run: |
               mkdir -p allure-results
               RUN_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
               cat > allure-results/environment.properties <<EOF
               Stage=${STAGE}
               Suite=${SUITE}
               Threads=${THREADS}
               Branch=${GITHUB_REF_NAME}
               Commit=${GITHUB_SHA}
               Run=${GITHUB_RUN_NUMBER}
               Run time=${RUN_TIME}
               EOF
          
               cat > allure-results/executor.json <<EOF
               {
                "reportName": "Run #${GITHUB_RUN_NUMBER} | ${SUITE} | ${THREADS} threads | ${RUN_TIME}",
                "buildOrder": ${GITHUB_RUN_NUMBER},
                "reportUrl": "https://jndef.github.io/API-test-automation-framework/",
                "name": "GitHub Actions",
                "type": "github",
                "buildName": "Run #${GITHUB_RUN_NUMBER}, attempt #${GITHUB_RUN_ATTEMPT}",
                "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
               }
               EOF
          
               echo "=== Environment metadata ==="
               cat allure-results/environment.properties
          
               echo "=== Executor metadata ==="
               cat allure-results/executor.json

      - name: Run API tests via docker
        run: docker compose up --build --exit-code-from smoke-api-test smoke-api-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ inputs.SUITE }}-threads-${{ inputs.THREADS }}
          path: allure-results
  report:
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Checkout Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .github/gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Copy Allure history
        run: |
          mkdir -p allure-results/history

          if [ -d ".github/gh-pages/history" ]; then
            cp -R .github/gh-pages/history/. allure-results/history/
          fi
      - name: Verify Allure metadata
        run: |
          echo "=== Downloaded files ==="
          ls -la allure-results
          
          echo "=== Environment ==="
          cat allure-results/environment.properties
          
          echo "=== Executor ==="
          cat allure-results/executor.json

      - name: Generate Allure report
        run: docker compose run --build --rm report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Persist Allure history
        continue-on-error: true
        run: |
          if [ ! -d "allure-report/history" ]; then
            echo "Allure history directory was not generated"
            exit 0
          fi

          rm -rf .github/gh-pages/history
          mkdir -p .github/gh-pages/history
          cp -R allure-report/history/. .github/gh-pages/history/

          git -C .github/gh-pages config user.name "github-actions[bot]"
          git -C .github/gh-pages config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C .github/gh-pages add history

          if git -C .github/gh-pages diff --cached --quiet; then
            echo "Allure history has no changes"
          else
            git -C .github/gh-pages commit -m "Update Allure history"
            git -C .github/gh-pages push origin HEAD:gh-pages
          fi

  deploy:
    needs: report
    if: always() && needs.report.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
